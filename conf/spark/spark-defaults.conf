# Non-secret Spark settings; credentials are provided via AWS_* environment.
spark.master spark://spark-master:7077
spark.app.name homelab-sparkice
spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.ice org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.ice.type rest
spark.sql.catalog.ice.uri http://iceberg-rest:8181
spark.sql.catalog.ice.warehouse s3://home-iceberg/warehouse/
spark.sql.catalog.ice.io-impl org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.ice.s3.endpoint http://rustfs:9000
spark.sql.catalog.ice.s3.path-style-access true
spark.sql.defaultCatalog spark_catalog
spark.hadoop.fs.s3a.endpoint http://rustfs:9000
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.aws.credentials.provider com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.sql.shuffle.partitions 8
spark.default.parallelism 4
spark.eventLog.enabled false
spark.ui.showConsoleProgress true
spark.redaction.regex (?i)secret|password|token|access[._-]?key|credential
