server {
    listen 80;
    server_name jupyter.handyman.moscow;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name jupyter.handyman.moscow;
    ssl_certificate /etc/nginx/certs/handyman.moscow.pem;
    ssl_certificate_key /etc/nginx/certs/handyman.moscow-key.pem;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 200M;
    location / {
        set $jupyter_upstream http://jupyterhub:8000;
        proxy_pass $jupyter_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
